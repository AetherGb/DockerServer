; TOTK Seamless Co-op Configuration
; Place in server-data/coop_settings.ini

[Session]
; Lobby session password (leave blank for open session)
session_password = 

[Display]
; Overhead player name and status display mode:
; 0 = Off
; 1 = Name only
; 2 = Name + Ping (ms)
; 3 = Name + Hearts
; 4 = Name + Hearts + Ping (Seamless Co-op standard)
overhead_player_display = 4

; Enable HUD circular minimap radar icons for co-op players (1 = enabled, 0 = disabled)
hud_minimap_icons = 1

[Scaling]
; Health scaling percentage added per additional connected player (Elden Ring Seamless Co-op standard)
; 35 = +35% enemy health per extra player (1p: 100%, 2p: 135%, 3p: 170%, 4p: 205%)
enemy_health_scaling = 35

; 100 = +100% boss health per extra player (1p: 100%, 2p: 200%, 3p: 300%, 4p: 400%)
boss_health_scaling = 100

[CoopFeatures]
; Area bullet-time radius in meters (Option A: players within this radius enter slow-mo during bow aim/flurry rush)
bullet_time_range = 50

; Interval in seconds for authoritative day/night clock sync
time_sync_interval = 20
